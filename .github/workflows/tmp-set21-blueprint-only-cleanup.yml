name: Temporary SET-21 blueprint-only cleanup

on:
  push:
    branches:
      - codex/set21-blueprint-only-cleanup-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/set21-blueprint-only-cleanup-v2
          fetch-depth: 0
      - name: Apply exact minimal patch
        shell: python
        run: |
          from pathlib import Path
          import re

          drive_path = Path('app/lib/google-drive.ts')
          drive = drive_path.read_text()

          old_function_pattern = re.compile(
              r"  private async ensureProvisionedBlueprintFolder\(input: \{\n"
              r".*?"
              r"\n  \}\n\n  /\*\*\n   \* Ensures one blueprint folder beneath an exact managed parent\.",
              re.S,
          )
          new_function = '''  private async ensureProvisionedBlueprintFolder(input: {
            parentId: string;
            folder: WorkspaceBlueprintFolder;
            entityProperty: "fciClientId" | "fciProjectId";
            entityId: string;
            folderKind: "client-profile" | "client-project-links" | "client-child" | "project-child";
          }) {
            const identity = {
              key: PROVISIONED_BLUEPRINT_FOLDER_IDENTITY,
              value: input.folder.key,
            } satisfies FolderIdentity;
            const properties = normalizedAppProperties({
              [PROVISIONED_BLUEPRINT_FOLDER_IDENTITY]: input.folder.key,
              [input.entityProperty]: input.entityId,
              fciFolderKind: input.folderKind,
            });
            const canonical = async (folder: DriveFile) => {
              const currentKey = folder.appProperties?.[PROVISIONED_BLUEPRINT_FOLDER_IDENTITY];
              const currentEntity = folder.appProperties?.[input.entityProperty];
              const currentKind = folder.appProperties?.fciFolderKind;
              if (
                currentKey !== input.folder.key
                || (currentEntity && currentEntity !== input.entityId)
                || (currentKind && currentKind !== input.folderKind)
              ) {
                throw new GoogleIntegrationError(
                  "drive_folder_identity_conflict",
                  `The Google Drive folder named ${input.folder.name} already belongs to another managed blueprint item.`,
                  409,
                );
              }
              return Object.entries(properties).some(([key, value]) => folder.appProperties?.[key] !== value)
                ? this.stampFolder(folder, properties)
                : folder;
            };

            await this.assertContained(input.parentId);
            const managed = await this.childFoldersByIdentity(input.parentId, identity);
            if (managed.length > 1) {
              throw new GoogleIntegrationError("duplicate_drive_folder", `More than one managed Google Drive folder matched ${input.folder.name}.`, 409);
            }
            if (managed.length === 1) return canonical(managed[0]);

            const named = await this.childFolders(input.parentId, input.folder.name);
            if (named.length > 1) {
              throw new GoogleIntegrationError("ambiguous_drive_folder", `More than one Google Drive folder is named ${input.folder.name}.`, 409);
            }
            if (named.length === 1) {
              throw new GoogleIntegrationError(
                "drive_folder_identity_conflict",
                `A Google Drive folder named ${input.folder.name} already exists without this blueprint identity. Rename or remove that folder before retrying.`,
                409,
              );
            }

            const created = await this.createFolder(input.parentId, input.folder.name, properties);
            if (Object.entries(properties).some(([key, value]) => created.appProperties?.[key] !== value)) {
              throw new GoogleIntegrationError(
                "drive_create_invalid_response",
                "Google Drive did not confirm the managed blueprint folder identity. Check Drive before retrying.",
                503,
              );
            }
            return created;
          }

          /**
           * Ensures one blueprint folder beneath an exact managed parent.'''

          drive, count = old_function_pattern.subn(new_function, drive, count=1)
          assert count == 1, f'expected one ensureProvisionedBlueprintFolder replacement, got {count}'
          drive, count = re.subn(
              r"\n    const blueprintFolderKeys = workspaceBlueprintFolderKeys\(provisionableBlueprint\);",
              "",
              drive,
              count=1,
          )
          assert count == 1, f'expected one blueprintFolderKeys local removal, got {count}'
          drive, count = re.subn(r"\n          blueprintFolderKeys,", "", drive, count=1)
          assert count == 1, f'expected one blueprintFolderKeys argument removal, got {count}'
          drive_path.write_text(drive)

          test_path = Path('tests/workspace-drive-client.test.mjs')
          tests = test_path.read_text()

          legacy_pattern = re.compile(
              r'test\("provisioning reuses stable entity identities and adopts legacy child stamps additively", async \(\) => \{.*?\n\}\);\n\nfunction provisionedProjectFixture',
              re.S,
          )
          legacy_replacement = '''test("project provisioning refuses same-name child folders without blueprint keys", async () => {
            const blueprint = structuredClone(seedWorkspaceBlueprint());
            blueprint.naming.clientFolderPattern = "{name} [{code}]";
            const provider = inMemoryDriveProvider([
              { id: "shared-drive-root", name: "FCI Operations", mimeType: "application/vnd.google-apps.folder", parents: [], trashed: false, appProperties: {} },
              { id: "client-accounts-root", name: "01_Client Accounts", mimeType: "application/vnd.google-apps.folder", parents: ["shared-drive-root"], trashed: false, appProperties: { fciRootKey: "client-accounts" } },
              { id: "projects-root", name: "02_Projects", mimeType: "application/vnd.google-apps.folder", parents: ["shared-drive-root"], trashed: false, appProperties: { fciRootKey: "projects" } },
              { id: "existing-client", name: "Current client name [CL-042]", mimeType: "application/vnd.google-apps.folder", parents: ["client-accounts-root"], trashed: false, appProperties: { fciClientId: "client-1", fciFolderKind: "client" } },
              { id: "unstamped-profile", name: "00_Client Profile & Master Documents", mimeType: "application/vnd.google-apps.folder", parents: ["existing-client"], trashed: false, appProperties: { fciClientId: "client-1", fciFolderKind: "client-profile" } },
            ]);
            const client = new GoogleDriveClient("test-token", config(), provider.fetcher);

            await assert.rejects(
              client.provisionProjectFolders({
                client: { id: "client-1", code: "CL-042", name: "Current client name" },
                project: { id: "project-new", number: "PR-009", name: "FCI TEST Project", year: "2027" },
                blueprint,
              }),
              (error) => error?.code === "drive_folder_identity_conflict" && error?.status === 409,
            );

            assert.deepEqual(provider.files.get("unstamped-profile").appProperties, {
              fciClientId: "client-1",
              fciFolderKind: "client-profile",
            });
            assert.equal(provider.calls.some((call) => call.method === "PATCH"), false);
            assert.equal(provider.calls.some((call) => call.method === "DELETE"), false);
          });

          function provisionedProjectFixture'''
          tests, count = legacy_pattern.subn(legacy_replacement, tests, count=1)
          assert count == 1, f'expected one unstamped-child test replacement, got {count}'

          stale_pattern = re.compile(
              r'// Reproduced review defect:.*?test\("a stale blueprint-key stamp is re-adopted by name and updated in place", async \(\) => \{.*?\n\}\);\n\n// The escape hatch is narrow on purpose:.*?\n',
              re.S,
          )
          stale_replacement = '''// Blueprint keys are immutable runtime identities. A same-name folder carrying an old key
          // is not migrated or re-stamped during provisioning; an administrator must resolve the conflict.
          test("a stale blueprint-key stamp stays a conflict instead of being rewritten", async () => {
            const blueprint = structuredClone(seedWorkspaceBlueprint());
            const index = blueprint.drive.projectFolders.findIndex((folder) => folder.key === "lead-proposal");
            blueprint.drive.projectFolders.splice(index, 1, { key: "lead-package", name: "01_Lead & Proposal", management: "owner", children: [] });
            const provider = provisionedProjectFixture({
              id: "stale-lead",
              name: "01_Lead & Proposal",
              mimeType: "application/vnd.google-apps.folder",
              parents: ["the-project"],
              trashed: false,
              appProperties: { fciFolderKey: "lead-proposal", fciProjectId: "project-1", fciFolderKind: "project-child" },
            });
            const client = new GoogleDriveClient("test-token", config(), provider.fetcher);

            await assert.rejects(
              provisionProject(client, blueprint),
              (error) => error?.code === "drive_folder_identity_conflict" && error?.status === 409,
            );

            assert.deepEqual(provider.files.get("stale-lead").appProperties, {
              fciFolderKey: "lead-proposal",
              fciProjectId: "project-1",
              fciFolderKind: "project-child",
            });
            assert.equal(provider.calls.some((call) => call.method === "PATCH"), false);
            assert.equal(provider.calls.some((call) => call.method === "DELETE"), false);
          });

          // A key that is still defined likewise owns its folder; a different key claiming that
          // folder's name must stay a 409 rather than silently stealing it.
          '''
          tests, count = stale_pattern.subn(stale_replacement, tests, count=1)
          assert count == 1, f'expected one stale-key test replacement, got {count}'
          test_path.write_text(tests)

          workflow = Path('.github/workflows/tmp-set21-blueprint-only-cleanup.yml')
          workflow.unlink()
      - name: Verify diff is scoped
        run: |
          git diff --check
          git diff --stat
          git diff -- app/lib/google-drive.ts tests/workspace-drive-client.test.mjs
      - name: Commit clean patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/google-drive.ts tests/workspace-drive-client.test.mjs .github/workflows/tmp-set21-blueprint-only-cleanup.yml
          git commit -m "fix(set21): make project folder identities blueprint-only"
          git push origin HEAD:codex/set21-blueprint-only-cleanup-v2
